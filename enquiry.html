<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
  <nav>
        <a href="index.html">Home</a>
        <a href="about.html">Aboutus</a>
        <a href="Contactus.html">contact us page</a>
        <a href="enquiry.html">ENQUIRY</a>
        <a href="services.html">SERVICES</a>    
         </nav>  </header>

    <main>

        <section class="page-title">
            <h2>Make an Enquiry</h2>
            <p>Request a quotation or book a service.</p>
        </section>

        <section class="form-section">

            <form action="#" method="post">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="vehicle">Vehicle Make and Model:</label>
                <input type="text" id="vehicle" name="vehicle">

                <label for="service">Select Service:</label>

                <select id="service" name="service">
                    <option value="">-- Select a Service --</option>
                    <option value="servicing">Vehicle Servicing</option>
                    <option value="brakes">Brake Repairs</option>
                    <option value="diagnostics">Engine Diagnostics</option>
                    <option value="maintenance">General Maintenance</option>
                </select>

                <label for="message">Message:</label>

                <textarea id="message" name="message"
                    rows="6"
                    placeholder="Tell us how we can help you..."></textarea>

                <button type="submit">Submit Enquiry</button>

            </form>

        </section>

    </main>

    </footer>




</body>
</html>
